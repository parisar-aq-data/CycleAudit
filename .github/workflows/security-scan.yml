name: Security scan
# Looks for known-vulnerable libraries and risky PHP code patterns.
# REPORT-ONLY at first: findings are shown in the run summary but never block a pull request.
# Runs on pull requests, on main, once a week (new library advisories appear over time) and on demand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libraries:
    name: Known vulnerabilities in PHP libraries
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: composer audit
        continue-on-error: true
        run: |
          {
            echo "## composer audit (production libraries)"
            echo '```'
            composer audit --no-dev --locked --format=plain 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  code:
    name: Risky code patterns (Semgrep)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan the application code
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/php --config p/security-audit --config p/owasp-top-ten \
            --exclude vendor --exclude tests --exclude migrations --exclude node_modules \
            --metrics=off --quiet --text --output semgrep.txt . || true
          {
            echo "## Semgrep findings"
            echo '```'
            if [ -s semgrep.txt ]; then head -c 60000 semgrep.txt; else echo "No findings."; fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the full report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: semgrep.txt
          if-no-files-found: ignore
