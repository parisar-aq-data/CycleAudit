name: Live smoke test
# Read-only checks of the LIVE site (tests/smoke/smoke.py). Creates no accounts and changes nothing.
# Runs: after a deployment reports success to GitHub, every 6 hours, and on demand.
on:
  deployment_status:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Site to check'
        required: false
        default: 'https://cycleaudit.parisar.org'

jobs:
  smoke:
    name: Check the live site
    # For deployment events only act on successful ones.
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Give a fresh deployment a moment to start
        if: github.event_name == 'deployment_status'
        run: sleep 45
      - name: Run the smoke test
        env:
          SITE_URL: ${{ github.event.inputs.url || 'https://cycleaudit.parisar.org' }}
        run: python tests/smoke/smoke.py "$SITE_URL"
