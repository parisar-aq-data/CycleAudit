name: CI / CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  audit:
    name: Dependency security audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Check composer.lock for known vulnerabilities
        # Fails on known vulnerabilities only; abandoned packages are listed but do not fail the build.
        run: composer audit --locked --no-interaction --abandoned=report
  test:
    name: PHP Lint & PHPUnit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, xml
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install Composer dependencies (with dev)
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax lint (all .php files)
        run: find . -name "*.php" -not -path "./vendor/*" | xargs -n1 php -l
      - name: Run PHPUnit
        run: php vendor/bin/phpunit --testdox --colors=always
