name: CI / CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  audit:
    name: Dependency security audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - name: Check composer.lock for known vulnerabilities
        # Fails on known vulnerabilities only; abandoned packages are listed but do not fail the build.
        run: composer audit --locked --no-interaction --abandoned=report
  test:
    name: PHP Lint & PHPUnit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, xml
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install Composer dependencies (with dev)
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax lint (all .php files)
        run: find . -name "*.php" -not -path "./vendor/*" | xargs -n1 php -l
      - name: Run PHPUnit
        run: php vendor/bin/phpunit --testdox --colors=always
